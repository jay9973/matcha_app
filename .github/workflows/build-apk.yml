name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 릴리스/asset 생성 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android (generate native project)
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK (Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Compute version & checksum
        id: meta
        run: |
          VER=$(grep '"version"' app.json | head -1 | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          cat > latest.json <<EOF
          {
            "version": "$VER",
            "apk_url": "https://github.com/jay9973/matcha_app/releases/download/${VER}/matcha-${VER}.apk",
            "checksum": "$SHA",
            "note": "MATCHA 자동 배포 버전"
          }
          EOF

      - name: Create GitHub Release (recreate for same version)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.meta.outputs.version }}"
          # 같은 버전 태그 재배포 가능하게 기존 릴리스 삭제 후 재생성
          gh release delete "$VER" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$VER" \
            "android/app/build/outputs/apk/debug/app-debug.apk#matcha-${VER}.apk" \
            latest.json \
            --title "MATCHA v${VER}" \
            --notes "자동 배포. APK: matcha-${VER}.apk (debug)"
