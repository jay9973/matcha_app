name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 릴리스/asset 생성 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Export Android (standalone release bundle)
        run: npx expo export -p android --output-dir dist --clear

      - name: Debug Gradle env
        continue-on-error: true
        working-directory: android
        run: |
          {
            echo "pwd: $PWD"
            echo "node: $(node -v 2>&1)"
            echo "java: $(java -version 2>&1 | head -1)"
            echo "JAVA_HOME=$JAVA_HOME"
            echo "PATH=$PATH"
            chmod +x gradlew
            echo "--- gradlew --version ---"
            timeout 120 ./gradlew --version --no-daemon 2>&1
            echo "GRADLE_EXIT=$?"
          } > /tmp/gradle_debug.log 2>&1 || true
          cat /tmp/gradle_debug.log
          echo "DEBUG_DONE"

      - name: Upload Gradle debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-debug
          path: /tmp/gradle_debug.log

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Compute version & checksum
        id: meta
        run: |
          VER=$(grep '"version"' app.json | head -1 | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          APK="android/app/build/outputs/apk/release/app-release.apk"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          cat > latest.json <<EOF
          {
            "version": "$VER",
            "apk_url": "https://github.com/jay9973/matcha_app/releases/download/${VER}/app-release.apk",
            "apk_name": "app-release.apk",
            "checksum": "$SHA",
            "note": "MATCHA 자동 배포 버전"
          }
          EOF

      - name: Create GitHub Release (recreate for same version)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.meta.outputs.version }}"
          # 같은 버전 태그 재배포 가능하게 기존 릴리스 삭제 후 재생성
          gh release delete "$VER" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$VER" \
            "android/app/build/outputs/apk/release/app-release.apk" \
            latest.json \
            --title "MATCHA v${VER}" \
            --notes "자동 배포. APK: app-release.apk (standalone)"
